<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px -apple-system, BlinkMacSystemFont, sans-serif; width: 260px; margin: 12px; color: #1d1d1f; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #aaa; flex: none; }
  .good { background: #34c759; } .rec { background: #ff3b30; } .warn { background: #ff9f0a; }
  p { color: #6e6e73; margin: 8px 0 0; line-height: 1.35; }
  @media (prefers-color-scheme: dark) { body { background: #1e1e1e; color: #f5f5f7; } p { color: #a1a1a6; } }
</style>
</head>
<body>
<h1>Device Studio Speakers</h1>
<div class="row"><span id="appDot" class="dot"></span><span id="app">Checking…</span></div>
<div class="row"><span id="recDot" class="dot"></span><span id="rec"></span></div>
<div class="row"><span id="meetDot" class="dot"></span><span id="meet"></span></div>
<p>While Device Studio records, Meet's captions are turned on so each line of your transcript gets the speaker's name. Captions stay on this Mac.</p>
<script src="popup.js"></script>
</body>
</html>
